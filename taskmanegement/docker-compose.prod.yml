services:

  db:
    image: mysql:8.0

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: taskmanegement.settings

    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
        "taskmanegement.wsgi:application"
      ]

    expose:
      - "8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery-worker:
    build:
      context: .

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: taskmanegement.settings

    command:
      [
        "celery",
        "-A",
        "taskmanegement",
        "worker",
        "--loglevel=info",
        "--concurrency=4"
      ]

    depends_on:
      redis:
        condition: service_healthy

      db:
        condition: service_healthy


  celery-beat:
    build:
      context: .

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: taskmanegement.settings

    command:
      [
        "celery",
        "-A",
        "taskmanegement",
        "beat",
        "--loglevel=info",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler"
      ]

    depends_on:
      redis:
        condition: service_healthy

      db:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      - static_volume:/staticfiles:ro

      - media_volume:/media:ro

    depends_on:
      - web


volumes:

  mysql_data:

  redis_data:

  static_volume:

  media_volume: